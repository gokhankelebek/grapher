# Deploy Grapher to GitHub Pages — MANUAL ONLY.
#
# This workflow never runs on its own: there is no push, schedule or PR
# trigger. It runs only when someone presses "Run workflow" on the Actions tab
# (see DEPLOY.md). It builds with the /grapher/ base path, so the site is served
# at https://gokhankelebek.github.io/grapher/.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - name: Build for /grapher/
        run: npm run build
        env:
          GRAPHER_BASE: /grapher/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
